<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#14233d"><title>Create account · StockWise</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="index.html">Stock<span>Wise</span></a><p class="eyebrow" id="signup-eyebrow">ACCOUNT SETUP</p><h1 id="signup-title">Create your account</h1><p class="auth-copy" id="signup-copy">Set up the administrator account for your shop.</p><div id="auth-message" class="message" role="alert" hidden></div><form id="signup-form" class="auth-form"><label class="field">Full name<input name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="Your name"></label><label class="field">Email or phone number<input name="contact" type="text" autocomplete="username" required placeholder="you@example.com or +233…"></label><label class="field">Shop name<input id="shop-name" name="shopName" autocomplete="organization" required minlength="2" maxlength="120" placeholder="Your shop name"></label><label class="field">What role are you logging in as?<select id="signup-role" name="role" required><option value="administrator">Administrator</option><option value="sales_manager">Sales Manager</option></select></label><label class="field">Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label class="field">Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Enter the password again"></label><button class="button button-primary button-full" type="submit">Create administrator account</button></form><p class="auth-footnote">Already have an account? <a href="login.html">Log in</a></p><p class="auth-security">The first account is the administrator. The administrator registers one sales manager.</p></main><script src="js/api.js"></script><script src="js/auth-pages.js"></script></body></html>
